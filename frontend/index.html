<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>入試問題リファレンス</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>入試問題リファレンス</h1>
    <p class="subtitle">入試問題PDFをアップロードし、単元・問題数・大学名から問題を検索します</p>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="search">問題を探す</button>
    <button class="tab-btn" data-tab="upload">PDFアップロード</button>
    <button class="tab-btn" data-tab="list">アップロード済み一覧</button>
  </nav>

  <main>
    <section id="tab-search" class="tab-panel active">
      <form id="search-form" class="card">
        <div class="form-row">
          <label for="unit-input">単元</label>
          <input id="unit-input" name="unit" list="unit-list" placeholder="例: 微分・積分" required />
          <datalist id="unit-list"></datalist>
        </div>
        <div class="form-row">
          <label for="count-input">問題数</label>
          <input id="count-input" name="count" type="number" min="1" value="5" required />
        </div>
        <div class="form-row">
          <label for="university-input">大学名 (任意)</label>
          <input id="university-input" name="university" list="university-list" placeholder="例: 東京大学" />
          <datalist id="university-list"></datalist>
        </div>
        <div class="form-row">
          <label for="subject-input">科目 (任意)</label>
          <input id="subject-input" name="subject" list="subject-list" placeholder="例: 数学" />
          <datalist id="subject-list"></datalist>
        </div>
        <button type="submit">検索する</button>
      </form>

      <div id="search-status" class="status"></div>
      <div id="search-results" class="results-grid"></div>
    </section>

    <section id="tab-upload" class="tab-panel">
      <form id="upload-form" class="card">
        <div class="form-row">
          <label for="file-input">入試問題PDF (複数選択可)</label>
          <input id="file-input" type="file" accept="application/pdf" multiple required />
        </div>
        <div id="file-meta-list"></div>
        <button type="submit">アップロードして解析</button>
      </form>
      <div id="upload-status" class="status"></div>
    </section>

    <section id="tab-list" class="tab-panel">
      <div id="pdf-list" class="card"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
